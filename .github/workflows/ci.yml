name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migrations match schema
        run: >
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "file:${{ runner.temp }}/shadow.db"
          --exit-code

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build and e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_HASH=${{ github.sha }}

  changelog:
    name: Release changelog
    # Release PRs only (from scripts/release.sh); skipped counts as passing
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # Required by the generate-notes API
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check every merged PR is in the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          expected="$(scripts/release-notes.sh "$tag" | grep -oE '/pull/[0-9]+' | sort -u || true)"
          listed="$(scripts/changelog-entry.sh "$tag" | grep -oE '/pull/[0-9]+' | sort -u || true)"
          missing="$(comm -23 <(echo "$expected") <(echo "$listed") | sed '/^$/d')"
          if [ -n "$missing" ]; then
            echo "::error::The $tag changelog entry is missing PRs merged to main since it was generated. Run 'npm run release refresh' on this branch."
            echo "Missing:"
            echo "$missing" | sed 's|^/pull/|  #|'
            exit 1
          fi
          echo "$tag changelog entry lists every merged PR"
