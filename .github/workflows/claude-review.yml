name: Claude PR review

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Skip drafts and fork PRs (forks don't receive secrets) - only applies
    # to the automatic pull_request trigger, not a manual workflow_dispatch
    # run, which has no pull_request context to check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            Review this pull request. Focus on:
            - Correctness bugs and edge cases
            - Security issues, especially cross-user data access (every query must be scoped to the signed-in user)
            - Deviations from the conventions in AGENTS.md
            - Missing tests for new server actions or API routes

            Be concise and skip style nitpicks that ESLint would catch.
            Use `gh pr diff` and `gh pr view` to read the PR. Leave inline comments on
            specific lines with mcp__github_inline_comment__create_inline_comment, and
            post a short overall summary with `gh pr comment`. If there's nothing worth
            flagging, just leave a one-line summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
