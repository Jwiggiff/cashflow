version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Auth.js's passkey provider (@auth/core) is written against the v9 API
      # and peer-depends on ^9; v10+ breaks passkey registration. Drop this
      # once @auth/core supports a newer major.
      - dependency-name: "@simplewebauthn/*"
        update-types: ["version-update:semver-major"]
      # Prisma 7 requires driver adapters (better-sqlite3), moves the datasource
      # URL into prisma.config.ts, and changes CLI flags we use in CI and tests.
      # Drop this when doing that migration as its own change.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
