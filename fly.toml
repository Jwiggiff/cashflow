# Used only for ephemeral PR preview deploys (see
# .github/workflows/pr-preview.yml) - not a production config. `app` below
# is a placeholder; the workflow always overrides it with
# `--app cashflow-pr-<PR number>` so every PR gets its own isolated app.
#
# No volume on purpose: the SQLite DB is on the ephemeral rootfs and is
# re-seeded on every boot (SEED_ON_START), so anything created in a preview
# is lost once the machine idles and stops.
app = "cashflow-preview"
primary_region = "yyz"

[build]

[env]
  SEED_ON_START = "true"
  SEED_USERNAME = "dev"
  SEED_PASSWORD = "preview-dev-pass"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
